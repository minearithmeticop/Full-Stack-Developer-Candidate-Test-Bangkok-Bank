services:
  db:
    image: postgres:17-alpine
    container_name: bookmark_db_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bookmark_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookmark_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DATABASE_MODE: postgres
    container_name: bookmark_backend_postgres
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_MODE=postgres
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/bookmark_db?schema=public
      - AUTH0_DOMAIN=dev-yg.us.auth0.com
      - AUTH0_AUDIENCE=https://bbl-candidate-test-api
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookmark_frontend_postgres
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
